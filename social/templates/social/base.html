{% load static %}
<!DOCTYPE html>
<html>
<head>

    <title>Mini Social Media</title>

    <link
        rel="stylesheet"
        href="{% static 'social/style.css' %}"
    >

</head>

<body>

<nav>

    <a href="{% url 'home' %}">
        Home
    </a>

    {% if user.is_authenticated %}

        <a href="{% url 'profile' user.username %}">
            My Profile
        </a>

        <span>
            Hello, {{ user.username }}
        </span>

        <form
            action="{% url 'logout' %}"
            method="post"
            style="display:inline;"
        >

            {% csrf_token %}

            <button type="submit">
                Logout
            </button>

        </form>

    {% else %}

        <a href="{% url 'login' %}">
            Login
        </a>

        <a href="{% url 'register' %}">
            Register
        </a>

    {% endif %}

</nav>

<div class="container">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
